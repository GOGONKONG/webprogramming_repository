<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>치이카와 · 인어섬의 비밀</title>
  <link rel="stylesheet" href="style.css">
  <!-- 인터넷 없이도 실행되도록 jQuery를 폴더 안에 보관합니다. -->
  <script src="js/jquery-3.7.1.min.js" defer></script>
  <script src="js/script.js" defer></script>
</head>
<body>
  <!-- 고정 크기 무대. absolute 요소들의 좌표 기준입니다. -->
  <div class="poster-frame" id="posterFrame">
  <main class="poster" id="poster" aria-label="치이카와 인어섬의 비밀 인터랙티브 포스터">
    <img class="scene sky" src="images/sky.png" alt="">
    <img class="scene clouds" src="images/cloud.png" alt="">
    <img class="scene islands" src="images/islands.png" alt="">
    <img class="scene sea" src="images/sea.png" alt="">

    <!-- 같은 파도 PNG를 CSS clip-path로 반씩 보여줍니다. -->
     <div class="wave-side wave-left">
     <img class="scene" src="images/wave_left.png" alt="">
     </div>

     <div class="wave-side wave-right">
      <img class="scene" src="images/wave_right.png" alt="">
     </div>
    <img class="scene land" src="images/land.png" alt="">

    <!-- 바깥 div: 좌우 이동 / 안쪽 img: 반복 흔들림. transform 충돌 방지. -->
    <div class="cast cast-left" aria-label="왼쪽 친구들">
      <img class="character siren" src="images/siren.png" alt="세이렌">
      <img class="character kani" src="images/kani-momonga.png" alt="카니와 모몽가">
      <img class="character usagi" src="images/usagi.png" alt="우사기">

    </div>
    <div class="cast cast-right" aria-label="오른쪽 친구들">
      <img class="character rakko" src="images/rakko.png" alt="랏코">
      <img class="character hachiware" src="images/hachiware.png" alt="하치와레">
      <img class="character kurimanju" src="images/kurimanju.png" alt="쿠리만쥬">
      <img class="character shisa" src="images/shisa.png" alt="시사">
    </div>
      <div class="shimajiro-pair">
        <!-- 새를 먼저 그려서 아저씨의 어깨 뒤로 보냅니다. -->
        <img class="bird" src="images/bird.png" alt="어깨에 앉은 새">
        <img class="shimajiro" src="images/shimajiro.png" alt="시마지로">
      </div>
    <img class="scene foreground-rock" src="images/land.png" alt="">
    <img class="leaves" src="images/leaves.png" alt="한잎이와 두잎이">


    <div class="title-block" aria-hidden="true">
      <h1><img src="images/logo.png" alt="극장판 치이카와 인어섬의 비밀"></h1>
    </div>
    <!-- 실제 button이므로 Tab → Enter/Space로도 실행됩니다. -->
    <div class="chiikawa-group">
      <img class="chiikawa" src="images/chiikawa.png" alt="치이카와">
    <button class="scale-button" id="scaleButton" type="button" aria-label="비늘을 하늘로 날려 보내기" disabled>
      <img src="images/scale.png" alt="분홍빛 비늘">
</body>
</html>
